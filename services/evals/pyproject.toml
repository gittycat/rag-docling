[project]
name = "ragbench-evals"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "llama-index-core>=0.14.4",
    "llama-index-llms-ollama>=0.8.3",
    "llama-index-llms-openai>=0.3.33",
    "llama-index-llms-anthropic>=0.6.10",
    "anthropic>=0.75.0",
    "datasets>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "eval: dataset-loader/integration tests that hit the network (HuggingFace downloads) or require API keys — skipped by default, use --run-eval",
]
addopts = "--strict-markers"
