services:
  # WebApp - SvelteKit frontend for RAG system
  webapp:
    build:
      context: ./services/webapp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:3000"
    environment:
      - ORIGIN=http://localhost:8000
      - RAG_SERVER_URL=http://rag-server:8001
      - EVALS_SERVICE_URL=http://evals:8002
      - MAX_UPLOAD_SIZE=80
    depends_on:
      rag-server:
        condition: service_healthy
    networks:
      - public
      - private

  # RAG Server - API service for document processing and querying
  rag-server:
    build:
      context: .
      dockerfile: ./services/rag_server/Dockerfile
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8001:8001"
    secrets:
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - RAG_SERVER_DB_USER
      - RAG_SERVER_DB_PASSWORD
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=ragbench
      - LOG_LEVEL=WARNING
      - MAX_UPLOAD_SIZE=80
      - SHARED_UPLOAD_DIR=/tmp/shared
      - USE_CACHED_RERANKER=true
      # Optional measured self-hosted rates. Empty is deliberately unpriced,
      # never a zero-cost fallback; see `just llm-price`.
      - MODEL_PRICE_OVERRIDES=${MODEL_PRICE_OVERRIDES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      tei:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10
      # Startup imports torch, opens the DB pool and pre-loads the reranker.
      # Warm on a laptop, but on a cold instance (first container start, cold
      # page cache) it runs well past 10s, and every dependent then fails with
      # "dependency failed to start: rag-server is unhealthy". Failures inside
      # start_period do not count, and a success ends it early, so a generous
      # window costs nothing when the service is warm.
      start_period: 120s
    networks:
      - private
      - public
    volumes:
      - ./config.yml:/app/config.yml             # Model configuration (read-write for settings)
      - ./data/indexed_documents:/app/documents
      - docs_repo:/tmp/shared
      - ./.cache/huggingface:/home/appuser/.cache/huggingface

  # PostgreSQL 17 with pg_textsearch (BM25) and pgvector/pgvectorscale
  postgres:
    build:
      context: ./services/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER_FILE: /run/secrets/POSTGRES_SUPERUSER
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_SUPERPASSWORD
      POSTGRES_DB: ragbench
    secrets:
      - POSTGRES_SUPERUSER
      - POSTGRES_SUPERPASSWORD
      - RAG_SERVER_DB_USER
      - RAG_SERVER_DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./services/postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./services/postgres/02-grants.sh:/docker-entrypoint-initdb.d/02-grants.sh:ro
    # This is the real max_connections setting — config.yml's database.max_connections
    # key was never read by the application and has been removed.
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/POSTGRES_SUPERUSER) -d ragbench"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - private
    restart: unless-stopped

  # TEI (HuggingFace Text Embeddings Inference) - serves Qwen3-Embedding-0.6B
  # for the active embedding model (config.yml models.embedding.qwen3-embed).
  tei:
    # No versioned arm64 CPU tag is published upstream — HuggingFace only
    # publishes versioned CPU tags (cpu-1.9, cpu-1.8, ...) as amd64-only
    # manifests. cpu-arm64-latest is the only arm64 CPU image, so it is
    # pinned by digest here to avoid silently floating onto a new build.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:35c50d7494de22deecdb783b8f5b7e1d05765709bd90071b03469b9440d28656
    restart: unless-stopped
    # --max-batch-tokens 2048: TEI's warmup pushes one synthetic max-size batch
    # through the model before it will serve anything. On this 0.6B model on
    # CPU, the TEI default of 16384 makes that warmup batch too large — warmup
    # never completes (measured 8+ minutes, still not done) and /health never
    # returns 200, so the container never comes up. 2048 warms up in ~18s.
    # Confirmed side effect: this also clamps max_input_length to 2048 tokens,
    # 4x our ~500-token chunks (Settings.chunk_size = 500), so truncation never
    # bites. Do not raise this back toward the TEI default.
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B", "--port", "80", "--max-client-batch-size", "32", "--max-batch-tokens", "2048"]
    volumes:
      # Caches the downloaded model weights so a container restart/recreate
      # doesn't re-pull them from HuggingFace.
      - tei_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Cold start downloads ~1.2GB of safetensors before warmup even begins —
      # measured ~170s on a fast connection, plus ~18s warmup. 120s was too
      # short and marked the service unhealthy on any first boot with an empty
      # tei_data volume, failing depends_on: service_healthy for rag-server and
      # task-worker. `just init` / bake.sh pre-warm the volume so steady-state
      # boots are fast; this grace period only covers the genuinely-cold case.
      start_period: 300s
    networks:
      # `private` is internal: true (no egress), which is all TEI needs once its
      # weights are cached. But a cold tei_data volume has to fetch ~1.2GB from
      # huggingface.co, so it also sits on `public` — the same reason the Ollama
      # service it replaced was dual-homed. Nothing is published from either
      # network; this is egress only.
      - private
      - public

  # Self-hosted judge. Profile-gated, so a bare `just up` never starts it — use
  # `just judge-up`. It exists because judge prompts embed retrieved chunks and
  # generated answers verbatim and are never masked, so evaluating a
  # confidential corpus at a third-party endpoint is refused by the data-policy
  # gate (config.yml `data_policy`). An in-boundary judge is what makes those
  # runs possible at all, rather than merely permitted.
  #
  # CUDA only. vLLM has no usable darwin/arm64 path, so on a Mac this service
  # fails to start rather than quietly running somewhere unintended — that is
  # the intended behaviour, not a bug to work around.
  vllm:
    profiles: ["judge"]
    image: vllm/vllm-openai:v0.28.0
    restart: unless-stopped
    # Qwen3-32B at 4-bit AWQ needs ~24GB of VRAM (a standard figure for the
    # quantization, not measured here). Override JUDGE_MODEL for a smaller
    # model on constrained hardware — a judge that does not fit is a judge that
    # scores nothing.
    command:
      - "--model"
      - "${JUDGE_MODEL:-Qwen/Qwen3-32B-AWQ}"
      - "--port"
      - "8000"
      - "--served-model-name"
      - "${JUDGE_MODEL:-Qwen/Qwen3-32B-AWQ}"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      # Same reasoning as tei_data: keep the weights across container recreates.
      - vllm_data:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      # A cold weights volume pulls tens of GB before the server binds.
      start_period: 900s
    networks:
      # No published ports: the judge is reachable only from inside the compose
      # network, which is the whole point of it being in-boundary. `public` is
      # for the cold-start weights pull, same as tei.
      - private
      - public

  # Task Worker - Async document processing via SKIP LOCKED
  task-worker:
    build:
      context: .
      dockerfile: ./services/rag_server/Dockerfile
    command: [".venv/bin/python", "-m", "infrastructure.tasks.task_worker"]
    user: "1000:1000"
    restart: unless-stopped
    secrets:
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - RAG_SERVER_DB_USER
      - RAG_SERVER_DB_PASSWORD
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=ragbench
      - LOG_LEVEL=WARNING
      - MAX_UPLOAD_SIZE=80
      - SHARED_UPLOAD_DIR=/tmp/shared
      - USE_CACHED_RERANKER=true
      - WORKER_CONCURRENCY=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rag-server:
        condition: service_healthy
      tei:
        condition: service_healthy
    networks:
      - private
      - public
    volumes:
      - ./config.yml:/app/config.yml             # Model configuration (read-write for settings)
      - ./data/indexed_documents:/app/documents
      - docs_repo:/tmp/shared
      - ./.cache/huggingface:/home/appuser/.cache/huggingface

  # Evals Service - API (port 8002) + CLI
  evals:
    build:
      context: .
      dockerfile: ./services/evals/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - RAG_SERVER_URL=http://rag-server:8001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=ragbench
      - LOG_LEVEL=WARNING
      - MODEL_PRICE_OVERRIDES=${MODEL_PRICE_OVERRIDES:-}
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./services/evals/evals/data:/app/evals/data
      - ./data/eval_runs:/app/data/eval_runs
      # Calibration results are evidence about how much the judge scores can be
      # trusted; without this mount they vanish when the container is recreated.
      - ./data/calibration:/app/data/calibration
      - ./.cache/huggingface:/home/appuser/.cache/huggingface
      - ./.cache/datasets:/app/data/dataset_cache
    secrets:
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - RAG_SERVER_DB_USER
      - RAG_SERVER_DB_PASSWORD
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - public
      - private
    depends_on:
      rag-server:
        condition: service_healthy

# Network configuration for security isolation
networks:
  public:
    driver: bridge
  private:
    driver: bridge
    internal: true # full isolation of services on this network
    external: false # =true if the network is defined outside of this file

# Persistent volumes
volumes:
  postgres_data:
    driver: local
  docs_repo:
    driver: local
  tei_data:
    driver: local
  vllm_data:
    driver: local

secrets:
  # To add a new cloud LLM provider: declare its secret here, add it to the
  # `secrets:` list of each service that needs it below, and see
  # services/rag_server/infrastructure/llm/config.py for the rest of the wiring.
  OPENAI_API_KEY:
    file: secrets/OPENAI_API_KEY
  ANTHROPIC_API_KEY:
    file: secrets/ANTHROPIC_API_KEY
  POSTGRES_SUPERUSER:
    file: secrets/POSTGRES_SUPERUSER
  POSTGRES_SUPERPASSWORD:
    file: secrets/POSTGRES_SUPERPASSWORD
  RAG_SERVER_DB_USER:
    file: secrets/RAG_SERVER_DB_USER
  RAG_SERVER_DB_PASSWORD:
    file: secrets/RAG_SERVER_DB_PASSWORD
