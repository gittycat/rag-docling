# Forgejo CI/CD Pipeline for ragbench
#
# Triggers:
#   - On every push to any branch
#   - On pull requests
#   - Manual workflow dispatch
#
# Jobs (all always-on — nothing here is gated):
#   - test-rag-server: rag_server hermetic unit tests (tests/, excluding
#     tests/integration, which self-skips without --run-integration)
#   - test-evals: services/evals hermetic unit tests (tests/, excluding
#     eval-marked tests, which self-skip without --run-eval — those need
#     network access for HuggingFace dataset downloads and/or API keys)
#   - docker-build: verify the rag-server and webapp Docker images build
#
# There is no CI job for the real end-to-end eval — that's `just test-eval`,
# which needs docker compose plus a running rag-server and isn't something
# a stateless CI runner can do without a lot more setup than this file has.
# The previous "test-eval" job here didn't do that anyway: it ran a since-
# deleted rag_server test file with a since-deleted dependency group, so it
# was broken as committed and always failed or was skipped. Removed rather
# than fixed — see docs/suggestions.md #4.2.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # rag_server unit tests
  test-rag-server:
    name: RAG Server Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: services/rag_server
        run: |
          uv sync

      - name: Run tests
        working-directory: services/rag_server
        run: |
          uv run pytest tests/ -v --tb=short

  # services/evals unit tests (plain unit tests — no API key, no eval run needed)
  test-evals:
    name: Evals Tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: services/evals
        run: |
          uv sync

      - name: Run tests
        working-directory: services/evals
        run: |
          uv run pytest tests/ -v --tb=short

  # Docker build verification
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build RAG Server image
        run: |
          docker build -f services/rag_server/Dockerfile -t rag-server:${{ github.sha }} .

      - name: Build Webapp image
        run: |
          docker build -f services/webapp/Dockerfile -t webapp:${{ github.sha }} services/webapp/

      - name: Show image sizes
        run: |
          echo "=== Docker Images ==="
          docker images | grep -E "(rag-server|webapp)"
